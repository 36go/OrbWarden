<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quest Bot Dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #1e1f22;
    color: #e6e6e6;
    min-height: 100vh;
  }
  header {
    padding: 24px 32px;
    background: #2b2d31;
    border-bottom: 1px solid #3f4147;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #23a55a; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 32px; }
  .quest {
    background: #2b2d31;
    border: 1px solid #3f4147;
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .quest .meta { display: flex; gap: 10px; align-items: center; font-size: 12px; color: #949ba4; margin-bottom: 8px; }
  .quest .content { white-space: pre-wrap; word-break: break-word; margin: 0 0 10px; line-height: 1.45; }
  .quest a { color: #00a8fc; text-decoration: none; font-size: 13px; }
  .quest a:hover { text-decoration: underline; }
  .empty { color: #949ba4; text-align: center; padding: 40px 0; }
  .footer { text-align: center; color: #6c7280; font-size: 12px; padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>🏆 Quest Bot Dashboard</h1>
  <div class="status"><span class="dot"></span><span id="status-text">Checking status…</span></div>
</header>
<main>
  <div id="list"><p class="empty">Loading quests…</p></div>
</main>
<div class="footer">Static dashboard — data updated by the quest bot on each new announcement.</div>

<script>
async function loadQuests() {
  try {
    const res = await fetch('quests.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const list = document.getElementById('list');
    const status = document.getElementById('status-text');
    if (!data || data.length === 0) {
      status.textContent = 'Bot online • 0 quests';
      list.innerHTML = '<p class="empty">No quests recorded yet.</p>';
      return;
    }
    status.textContent = 'Bot online • ' + data.length + ' quest(s)';
    list.innerHTML = data.map(q => `
      <div class="quest">
        <div class="meta">
          <span>🧭 ${esc(q.channel)}</span>
          <span>⏰ ${esc(q.timestamp)}</span>
          <span>✍️ ${esc(q.author)}</span>
        </div>
        <p class="content">${esc(q.content)}</p>
        <a href="${esc(q.jump_url)}" target="_blank">↗ Jump to pinned quest</a>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('status-text').textContent = 'Bot online • dashboard offline';
    document.getElementById('list').innerHTML = '<p class="empty">Could not load quest data.</p>';
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

loadQuests();
setInterval(loadQuests, 15000);
</script>
</body>
</html>
